version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeiq-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./resumeiq.db
      - SECRET_KEY=production-secure-secret-key-change-me
      - AI_PROVIDER=fallback
      - OPENAI_API_KEY=
      - OPENAI_MODEL=gpt-4o-mini
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/exports:/app/exports
      - ./backend/resumeiq.db:/app/resumeiq.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumeiq-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
